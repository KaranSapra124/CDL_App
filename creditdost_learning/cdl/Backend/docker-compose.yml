services:
  postgres:
    image: postgres:17
    container_name: credit-dost-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: creditdost
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: creditdost_learning

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditdost -d creditdost_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: